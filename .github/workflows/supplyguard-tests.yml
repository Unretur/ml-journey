name: SupplyGuard tests

on:
  push:
    paths:
      - "Projects/SupplyGuard/**"
      - ".github/workflows/supplyguard-tests.yml"
  pull_request:
    paths:
      - "Projects/SupplyGuard/**"
      - ".github/workflows/supplyguard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/SupplyGuard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Projects/SupplyGuard/requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit and API contract tests
        run: python -m pytest tests/ -q
